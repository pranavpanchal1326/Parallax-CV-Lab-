<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img"><title>S-06 / Know the landmark</title><desc>Identify an existing safety point; this study is not approved emergency signage. Concept sign study, not installed or approved signage.</desc><rect width="1200" height="440" fill="#f3f0e7"/><rect width="18" height="440" fill="#343fc6"/><g font-family="Arial, sans-serif"><text x="58" y="62" fill="#202129" font-size="18" >S-06 / FE-1 / CONCEPT SIGN STUDY</text><text x="58" y="170" fill="#202129" font-size="64" font-family="Georgia, serif">Know the landmark</text><text x="58" y="258" fill="#202129" font-size="30" >FE-1 · reference posted local procedures</text><line x1="58" y1="320" x2="1142" y2="320" stroke="#202129" /><text x="58" y="382" fill="#202129" font-size="21" >Readable ID first · review size, placement and approved content before installation</text></g></svg>