<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Submission packet verification harness</title>
<style>*{box-sizing:border-box}body{margin:20px;font:16px/1.5 Arial,sans-serif;color:#17202e;background:#fff}button,select{font:inherit;min-height:44px;padding:8px}label{display:inline-block;margin:0 16px 12px 0}#surface{max-width:100%;overflow:auto;border:1px solid #687080}iframe{display:block;border:0;width:320px;height:900px}pre{white-space:pre-wrap;overflow-wrap:anywhere}h1{font-size:24px}nav{display:flex;gap:12px;flex-wrap:wrap}</style>
<h1>Submission packet verification</h1>
<p>Fixed iframe widths test CSS layout in this browser. They do not establish physical-device behavior, browser zoom or spoken screen-reader use. Test pages never reset browser records.</p>
<label>Packet page <select id="page"><option value="/submission/index.html">Submission entry</option><option value="/submission/presentation.html">Presentation player</option><option value="/submission/demo/index.html">Backup walkthrough</option></select></label>
<label>Layout viewport <select id="width"><option value="320">320 px</option><option value="768">768 px</option><option value="1280">1280 px</option></select></label>
<nav><button id="measure">Read layout</button><button id="scan">Scan packet accessibility</button></nav>
<p id="status" role="status">Loading</p><details><summary>Layout receipt</summary><pre id="layout" tabindex="0" aria-label="Layout result"></pre></details><details><summary>Accessibility receipt</summary><pre id="audit" tabindex="0" aria-label="Accessibility result"></pre></details><details><summary>Harness runtime errors</summary><pre id="errors" tabindex="0" aria-label="Runtime errors">[]</pre></details>
<div id="surface"><iframe id="packet" title="Packet at the selected CSS layout viewport" src="/submission/index.html"></iframe></div>
<script>
const frame=document.getElementById('packet'), page=document.getElementById('page'), width=document.getElementById('width');
const status=document.getElementById('status'), layout=document.getElementById('layout'), audit=document.getElementById('audit'), scan=document.getElementById('scan');
let revision=0;const errors=[];function recordError(scope,event){errors.push({scope,message:event.message,filename:event.filename,line:event.lineno,column:event.colno,stack:event.error?.stack});document.getElementById('errors').textContent=JSON.stringify(errors,null,2);}addEventListener('error',event=>recordError('harness',event));
function measure(){const d=frame.contentDocument,w=frame.contentWindow,r=d.documentElement;layout.textContent=JSON.stringify({page:d.location.pathname,requestedWidth:Number(width.value),viewport:w.innerWidth,documentWidth:r.clientWidth,scrollWidth:r.scrollWidth,pageOverflow:r.scrollWidth>r.clientWidth,heading:d.querySelector('h1')?.textContent,controls:[...d.querySelectorAll('a,button,select,summary')].map(el=>{const box=el.getBoundingClientRect();return {label:(el.getAttribute('aria-label')||el.textContent).trim().slice(0,100),width:Math.round(box.width),height:Math.round(box.height),right:Math.round(box.right),left:Math.round(box.left)};})},null,2);status.textContent='Layout measured.';}
frame.onload=()=>{revision++;audit.textContent='';frame.contentWindow.addEventListener('error',event=>recordError('packet',event));measure();};
page.onchange=()=>{revision++;audit.textContent='';frame.src=page.value;};
width.onchange=()=>{frame.style.width=width.value+'px';requestAnimationFrame(measure);};
document.getElementById('measure').onclick=measure;
scan.onclick=async()=>{const token=revision,d=frame.contentDocument,w=frame.contentWindow;scan.disabled=true;status.textContent='Scanning the selected packet page…';try{if(!w.axe)await new Promise((resolve,reject)=>{const script=d.createElement('script');script.src='/apps/lab-web/node_modules/axe-core/axe.min.js';script.onload=resolve;script.onerror=reject;d.head.append(script);});if(token!==revision)return;const result=await w.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21a','wcag21aa','wcag22aa','best-practice']}});if(token!==revision)return;audit.textContent=JSON.stringify({page:d.location.pathname,viewport:w.innerWidth,violations:result.violations.map(v=>({id:v.id,impact:v.impact,help:v.help,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),incomplete:result.incomplete.map(v=>({id:v.id,nodes:v.nodes.map(n=>({target:n.target,summary:n.failureSummary}))})),passedRules:result.passes.length,engine:result.testEngine},null,2);status.textContent='Packet scan complete.';}catch(error){if(token===revision){audit.textContent=String(error);status.textContent='Packet scan failed.';}}finally{scan.disabled=false;}};
</script></html>
