<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
<title id="title">WF14 · Faculty: correct attendance</title><desc id="desc">Faculty correct a session attendance record with an explicit reason and audit history.. Stale revision or failed save retains the proposed correction; reconcile current record before retry.</desc>
<rect width="760" height="500" fill="#fff"/>
<rect x="16" y="16" width="728" height="36" fill="#eee" stroke="#444"/>
<text x="28" y="39" font-family="Arial" font-size="12" fill="#222">PARALLAX / task navigation / role preview</text>
<text x="20" y="83" font-family="Arial" font-size="23" fill="#222">Faculty: correct attendance</text>
<rect x="20" y="105" width="720" height="54" fill="#fafafa" stroke="#555" />
<text x="32" y="129" font-family="Arial" font-size="14" font-weight="700" fill="#222">1 / Session / selected attendance record / revision</text>
<text x="32" y="149" font-family="Arial" font-size="12" font-weight="400" fill="#222">Private detail stays off public projections</text>
<rect x="20" y="181" width="435" height="150" fill="#fafafa" stroke="#555" />
<text x="32" y="205" font-family="Arial" font-size="14" font-weight="700" fill="#222">2 / Correction form</text>
<text x="32" y="225" font-family="Arial" font-size="12" font-weight="400" fill="#222">Current state → proposed state</text>
<text x="32" y="245" font-family="Arial" font-size="12" font-weight="400" fill="#222">Reason [ labelled text field ]</text>
<text x="32" y="265" font-family="Arial" font-size="12" font-weight="400" fill="#222">[ Save correction ]</text>
<rect x="475" y="181" width="265" height="150" fill="#fafafa" stroke="#555" />
<text x="487" y="205" font-family="Arial" font-size="14" font-weight="700" fill="#222">3 / Audit history</text>
<text x="487" y="225" font-family="Arial" font-size="12" font-weight="400" fill="#222">Actor / reason / timestamp</text>
<text x="487" y="245" font-family="Arial" font-size="12" font-weight="400" fill="#222">Previous and new value</text>
<text x="487" y="265" font-family="Arial" font-size="12" font-weight="400" fill="#222">No overwritten silent history</text>
<rect x="20" y="353" width="720" height="95" fill="#fafafa" stroke="#555" stroke-dasharray="5 3"/>
<text x="32" y="377" font-family="Arial" font-size="14" font-weight="700" fill="#222">4 / Record changed / save failed</text>
<text x="32" y="397" font-family="Arial" font-size="12" font-weight="400" fill="#222">Correction draft retained / reconcile current revision</text>
<text x="32" y="417" font-family="Arial" font-size="12" font-weight="400" fill="#222">Confirmation appears only after recorded success</text>
<text x="20" y="484" font-family="Arial" font-size="11" fill="#444">WF14 / Supplementary reconstruction of original P7-A concept / low fidelity / no fieldwork claimed</text></svg>